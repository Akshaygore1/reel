<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>@buildebugship — Blueprint Reel Runs</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#111620;--line:#334155;--text:#fff;--muted:#94a3b8;--teal:#40e0d0;--red:#fb7185}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:44px 24px 80px}header{display:grid;gap:14px;margin-bottom:28px}.brand{color:var(--red);font:700 13px ui-monospace,monospace;letter-spacing:.12em}h1{font-size:clamp(30px,5vw,54px);margin:0;letter-spacing:-.04em}p{color:var(--muted);margin:0}.tools{display:flex;gap:10px;flex-wrap:wrap}input,select,button,a.action{border:1px solid var(--line);border-radius:9px;background:#0d121b;color:var(--text);padding:10px 12px;text-decoration:none}input{min-width:260px;flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}article{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}video{display:block;width:100%;aspect-ratio:9/16;background:#05070a;object-fit:cover}section{padding:16px}h2{font-size:17px;margin:0 0 8px}.meta{color:var(--muted);font:12px ui-monospace,monospace;margin-bottom:14px}.row{display:flex;gap:8px;flex-wrap:wrap}button,a.action{cursor:pointer;font-weight:650}.primary{border-color:#287f78!important;color:var(--teal)!important}dialog{max-width:720px;width:calc(100% - 32px);background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px}pre{white-space:pre-wrap;word-break:break-word;color:var(--muted)}.empty{padding:50px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}
</style></head><body><main><header><div class="brand">@BUILDDEBUGSHIP · RUN ARCHIVE</div><h1>Blueprint reel runs</h1><p>Every treatment is immutable and independently inspectable. Disk deletion is CLI-only.</p><div class="tools"><input id="search" placeholder="Search topic, run ID, or mode"><select id="sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="topic">Topic A–Z</option></select><select id="mode"><option value="">All modes</option><option>bespoke</option><option>legacy-preset</option><option>legacy-migration</option></select></div></header><div id="grid" class="grid"></div></main>
<dialog id="dialog"><form method="dialog"><button style="float:right">Close</button></form><pre id="details"></pre></dialog>
<script src="output/catalog.js"></script><script>
const catalog=window.REEL_CATALOG||[],grid=document.querySelector('#grid'),search=document.querySelector('#search'),sort=document.querySelector('#sort'),mode=document.querySelector('#mode'),dialog=document.querySelector('#dialog'),details=document.querySelector('#details');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let q=search.value.toLowerCase(),items=catalog.filter(x=>(!mode.value||x.mode===mode.value)&&`${x.topic} ${x.run_id} ${x.mode}`.toLowerCase().includes(q));items.sort((a,b)=>sort.value==='topic'?a.topic.localeCompare(b.topic):sort.value==='old'?a.created_at.localeCompare(b.created_at):b.created_at.localeCompare(a.created_at));grid.innerHTML=items.length?'':`<div class="empty">No runs found. Generate one with <code>python3 -m reel scaffold "topic"</code>.</div>`;for(const x of items){let el=document.createElement('article');el.innerHTML=`<video controls playsinline preload="metadata" poster="${esc(x.poster_url)}"><source src="${esc(x.video_url)}" type="video/mp4"></video><section><h2>${esc(x.topic)}</h2><div class="meta">${esc(x.duration)}s · ${esc(x.resolution)} · 30fps<br>${esc(x.run_id)}</div><div class="row"><a class="action primary" href="${esc(x.video_url)}" download>Download</a><button class="copy">Copy caption</button><button class="inspect">Manifest</button></div></section>`;el.querySelector('.copy').onclick=()=>navigator.clipboard?navigator.clipboard.writeText(x.caption_text):prompt('Copy caption',x.caption_text);el.querySelector('.inspect').onclick=()=>{details.textContent=JSON.stringify(x,null,2);dialog.showModal()};grid.append(el)}}
[search,sort,mode].forEach(el=>el.addEventListener('input',render));render();
</script></body></html>
